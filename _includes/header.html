<header>
  <nav id="navbar" class="navbar navbar-light navbar-expand-sm {% if site.navbar_fixed %}fixed-top{% else %}sticky-top{% endif %}" aria-label="Primary navigation">
    <div class="container">
      <a class="navbar-brand" href="{{ '/' | relative_url }}" aria-label="Hanli Zhang home">
        <span class="brand-mark">HZ</span>
        <span class="brand-name">Hanli Zhang <small>张涵俐</small></span>
      </a>

      <button class="navbar-toggler collapsed ml-auto" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="sr-only">Toggle navigation</span>
        <span class="icon-bar top-bar"></span>
        <span class="icon-bar middle-bar"></span>
        <span class="icon-bar bottom-bar"></span>
      </button>

      <div class="collapse navbar-collapse text-right" id="navbarNav">
        <ul class="navbar-nav ml-auto flex-nowrap align-items-sm-center">
          <li class="nav-item"><a class="nav-link" href="{{ '/#work' | relative_url }}">work</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ '/#experience' | relative_url }}">experience</a></li>
          <li class="nav-item {% if page.permalink == '/cv/' %}active{% endif %}"><a class="nav-link" href="{{ '/cv/' | relative_url }}">résumé{% if page.permalink == '/cv/' %}<span class="sr-only"> (current)</span>{% endif %}</a></li>
          <li class="nav-item nav-github"><a class="nav-link" href="https://github.com/hanlizhang" aria-label="GitHub"><i class="fa-brands fa-github" aria-hidden="true"></i></a></li>
          {%- if site.enable_darkmode %}
          <li class="toggle-container">
            <button id="light-toggle" title="Change theme" aria-label="Change color theme">
              <i class="fa-solid fa-moon" aria-hidden="true"></i>
              <i class="fa-solid fa-sun" aria-hidden="true"></i>
            </button>
          </li>
          {%- endif %}
        </ul>
      </div>
    </div>
  </nav>
  {% if site.enable_progressbar %}
  <progress id="progress" value="0"><div class="progress-container"><span class="progress-bar"></span></div></progress>
  {%- endif %}
</header>
